name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk RemotePC-Plus.apk

      - name: Upload RemotePC-Plus.apk
        uses: actions/upload-artifact@v4
        with:
          name: RemotePC-Plus-APK
          path: RemotePC-Plus.apk
          retention-days: 30

      - name: Attach APK to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RemotePC-Plus.apk
