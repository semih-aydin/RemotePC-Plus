<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="squircleBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C2C2E"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="blueSignal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="rimHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="68%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="cursorShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Apple Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#squircleBg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#blueGlow)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="url(#rimHighlight)" stroke-width="1.5"/>

  <!-- Subtle Magic Trackpad Frame -->
  <rect x="20" y="24" width="88" height="80" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.2"/>

  <!-- Wireless Signal Arcs (Top-Right) -->
  <path d="M 68 38 A 22 22 0 0 1 90 60" fill="none" stroke="url(#blueSignal)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 68 48 A 12 12 0 0 1 80 60" fill="none" stroke="url(#blueSignal)" stroke-width="4.5" stroke-linecap="round" opacity="0.88"/>
  <circle cx="68" cy="60" r="3.5" fill="#5AC8FA"/>

  <!-- Precision Pointer Cursor -->
  <path d="M 38 39 L 71 65.5 L 55.8 68.2 L 62.2 84.5 L 54.6 87.8 L 48.2 71.5 L 38 80.5 Z"
        fill="#F5F5F7" filter="url(#cursorShadow)"/>
</svg>
