<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RemotePC+</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="app-root">
        <!-- Üst Çubuk -->
        <header class="top-bar">
            <div class="logo">RemotePC+</div>

            <div class="tabs">
                <button class="tab-btn active" data-mode="touchpad">Touchpad</button>
                <button class="tab-btn" data-mode="airmouse">Air Mouse</button>
                <button class="tab-btn" data-mode="context">Medya</button>
            </div>

            <div id="latency-val" class="ping-badge">0ms</div>
        </header>

        <!-- Ana Ekran -->
        <main class="main-area">
            <div id="drag-status-indicator" class="drag-indicator">SÜRÜKLENİYOR</div>

            <!-- 1. TOUCHPAD -->
            <div id="view-touchpad" class="touchpad-box">
                <div id="touchpad-surface" class="touchpad-pad">
                    Dokunmatik Alan<br>
                    <small style="color:#666; font-size:11px;">Çift dokunup tutarak sürükleyin</small>
                </div>
                <div id="scroll-strip-v" class="scroll-strip">
                    <i class="fas fa-arrows-alt-v"></i>
                </div>
            </div>

            <!-- 2. AIR MOUSE -->
            <div id="view-airmouse" class="airmouse-box">
                <!-- HTTPS Uyarısı (Tarayıcı HTTP'de jiroskopu engelliyorsa) -->
                <div id="https-warning-box" class="warning-box">
                    ⚠️ Tarayıcı güvenlik kısıtlaması nedeniyle jiroskop için HTTPS gereklidir.
                    <a href="https://192.168.1.103:5443" id="https-redirect-link">👉 HTTPS Portuna Geç (5443)</a>
                </div>

                <button id="start-gyro-btn" class="action-btn primary">
                    <i class="fas fa-play"></i> Sensörleri Başlat / İzin Ver
                </button>

                <div class="slider-box">
                    <div style="display:flex; justify-content:space-between;">
                        <span>Hassasiyet:</span>
                        <span id="airmouse-sens-val" style="font-weight:700; color:#fff;">3.5x</span>
                    </div>
                    <input id="airmouse-sens-slider" type="range" min="1.0" max="6.0" step="0.2" value="3.5">
                </div>

                <div id="gyro-debug-text" class="status-text">Sensör verisi bekleniyor...</div>
                <div id="sensor-status-msg" style="font-size:11px; color:#aaa;"></div>

                <button id="recenter-btn" class="action-btn">
                    <i class="fas fa-crosshairs"></i> Merkezi Sıfırla
                </button>
            </div>

            <!-- 3. MEDYA & SUNUM -->
            <div id="view-context" class="context-box">
                <div class="card">
                    <div class="card-title">MEDYA KONTROLLERİ</div>
                    <div class="btn-row">
                        <button class="small-btn" data-media-action="prev"><i class="fas fa-backward"></i></button>
                        <button class="round-btn" data-media-action="play_pause"><i class="fas fa-play"></i></button>
                        <button class="small-btn" data-media-action="next"><i class="fas fa-forward"></i></button>
                    </div>
                    <div style="display:flex; gap:8px; align-items:center; margin-top:4px;">
                        <i class="fas fa-volume-down" data-media-action="vol_down"></i>
                        <input id="media-vol-slider" type="range" min="0" max="100" value="50" style="flex:1;">
                        <i class="fas fa-volume-up" data-media-action="vol_up"></i>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">SUNUM KONTROLLERİ</div>
                    <div class="pres-row">
                        <button class="pres-btn" data-pres-action="prev">Önceki Slayt</button>
                        <button class="pres-btn" data-pres-action="next" style="background:#2563eb;">Sonraki Slayt</button>
                    </div>
                    <div style="display:flex; gap:8px; margin-top:4px;">
                        <button class="action-btn" data-pres-action="start">F5 Başlat</button>
                        <button class="action-btn" data-pres-action="stop">Esc Çık</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Alt Tıklama Çubuğu -->
        <footer class="bottom-bar">
            <button id="btn-click-left" class="click-btn primary">Sol Tık</button>
            <button id="btn-drag-lock" class="click-btn" style="flex:1;">Sürükle</button>
            <button id="btn-click-right" class="click-btn">Sağ Tık</button>
        </footer>
    </div>

    <script src="/js/haptics.js"></script>
    <script src="/js/multi_monitor.js"></script>
    <script src="/js/airmouse.js"></script>
    <script src="/js/touchpad.js"></script>
    <script src="/js/context_cards.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
